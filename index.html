<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Розклад КН01-23</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
<style id="app-css">
:root{
  color-scheme: light;
  --paper:#f1f4f1;
  --surface:#ffffff;
  --surface-2:#e8edea;
  --surface-3:#dde5e0;
  --grid:#d8e2db;
  --line:#cbd6d0;
  --line-2:#b3c2ba;
  --ink:#15201c;
  --ink-2:#54635c;
  --ink-3:#84928a;
  --pen:#2b4c9b;
  --pen-ink:#22407f;
  --on-pen:#ffffff;
  --pen-soft:#e5ebf8;
  --pen-line:#b9c8ea;
  --now:#c3322e;
  --now-soft:#fbe8e6;
  --den:#8a6414;
  --den-soft:#f7ecd6;
  --den-line:#e2ca9a;
  --ok:#1f6b4d;
  --shadow:0 1px 0 rgba(21,32,28,.04), 0 2px 6px rgba(21,32,28,.05);
  --shadow-lift:0 2px 4px rgba(21,32,28,.06), 0 12px 28px rgba(21,32,28,.13);
  --r:10px;
  --sans:"Commissioner", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --disp:"Unbounded", "Commissioner", ui-sans-serif, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0e1311;
    --surface:#171e1b;
    --surface-2:#1e2723;
    --surface-3:#26312c;
    --grid:#161d1a;
    --line:#2a3630;
    --line-2:#3a4a43;
    --ink:#e7ede9;
    --ink-2:#9aa9a1;
    --ink-3:#71807a;
    --pen:#8fb0f0;
    --pen-ink:#a8c3f7;
    --on-pen:#0e1311;
    --pen-soft:#182238;
    --pen-line:#2d4066;
    --now:#f2726a;
    --now-soft:#2a1817;
    --den:#e0b063;
    --den-soft:#2a2113;
    --den-line:#544122;
    --ok:#6fc79c;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.35);
    --shadow-lift:0 2px 4px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0e1311;
  --surface:#171e1b;
  --surface-2:#1e2723;
  --surface-3:#26312c;
  --grid:#161d1a;
  --line:#2a3630;
  --line-2:#3a4a43;
  --ink:#e7ede9;
  --ink-2:#9aa9a1;
  --ink-3:#71807a;
  --pen:#8fb0f0;
  --pen-ink:#a8c3f7;
  --on-pen:#0e1311;
  --pen-soft:#182238;
  --pen-line:#2d4066;
  --now:#f2726a;
  --now-soft:#2a1817;
  --den:#e0b063;
  --den-soft:#2a2113;
  --den-line:#544122;
  --ok:#6fc79c;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.35);
  --shadow-lift:0 2px 4px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.55);
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  background-position:-1px -1px;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; }
h1,h2,h3,h4,p{ margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--pen-ink); }
:focus-visible{ outline:2px solid var(--pen); outline-offset:2px; border-radius:4px; }
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.wrap{ max-width:1400px; margin:0 auto; padding:18px 16px 64px; }

/* ---------- masthead ---------- */
.mast{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 18px; margin-bottom:14px; }
.mast-id{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.mast h1{
  font-family:var(--disp); font-weight:700; font-size:clamp(19px,2.6vw,27px);
  letter-spacing:-.02em; line-height:1.05; text-wrap:balance;
}
.mast .grp{ color:var(--pen-ink); }
.mast-sub{ color:var(--ink-2); font-size:13px; letter-spacing:.01em; }
.mast-sub b{ font-weight:600; color:var(--ink-2); }
.mast-spacer{ flex:1 1 auto; }

/* ---------- controls ---------- */
.ctl{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:2px; gap:2px; }
.seg button{
  appearance:none; border:0; background:transparent; cursor:pointer;
  padding:6px 11px; border-radius:7px; font-size:13px; font-weight:500; color:var(--ink-2);
  white-space:nowrap; transition:background .12s, color .12s;
}
.seg button:hover{ color:var(--ink); }
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); font-weight:600; }
.seg button .auto{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-left:5px; }
.seg.parity button[aria-pressed="true"][data-p="num"]{ color:var(--pen-ink); }
.seg.parity button[aria-pressed="true"][data-p="den"]{ color:var(--den); }

.btn{
  appearance:none; cursor:pointer; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); border-radius:9px;
  padding:7px 12px; font-size:13px; font-weight:500; box-shadow:var(--shadow);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  transition:border-color .12s, transform .06s, background .12s;
}
.btn:hover{ border-color:var(--line-2); }
.btn:active{ transform:translateY(1px); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--pen); border-color:var(--pen); color:var(--on-pen); }
.btn-primary:hover{ border-color:var(--pen); filter:brightness(1.08); }
.btn-ghost{ background:transparent; box-shadow:none; }
.btn-danger{ color:var(--now); border-color:var(--line); }
.btn-danger:hover{ border-color:var(--now); }
.btn-sm{ padding:4px 9px; font-size:12px; border-radius:7px; }

/* ---------- now bar ---------- */
.now{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--ink-3);
  border-radius:var(--r); padding:11px 14px; margin:0 0 16px; box-shadow:var(--shadow);
  position:relative; overflow:hidden;
}
.now[data-live="1"]{ border-left-color:var(--now); }
.now[data-live="next"]{ border-left-color:var(--pen); }
.now-tag{
  font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap;
}
.now[data-live="1"] .now-tag{ color:var(--now); }
.now[data-live="next"] .now-tag{ color:var(--pen-ink); }
.now-main{ font-weight:600; font-size:15px; min-width:0; }
.now-main .sep{ color:var(--ink-3); font-weight:400; padding:0 2px; }
.now-meta{ color:var(--ink-2); font-size:13px; }
.now-meta .mono{ font-weight:500; color:var(--ink); }
.now-spacer{ flex:1 1 auto; }
.now-join{ text-decoration:none; }
.now-bar{ position:absolute; left:0; bottom:0; height:2px; background:var(--now); transition:width .5s linear; }
.now-clock{ font-family:var(--mono); font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums; }

/* ---------- week grid ---------- */
.scroller{ overflow-x:auto; overflow-y:visible; border-radius:var(--r); }
.wk{
  display:grid;
  grid-template-columns:78px repeat(var(--days,6), minmax(178px,1fr));
  gap:6px; padding-bottom:4px;
}
.wk-corner, .wk-day{
  position:sticky; top:0; z-index:3;
  background:var(--paper); padding:2px 0 8px;
}
.wk-corner{ left:0; z-index:4; }
.wk-day{ display:flex; align-items:baseline; gap:7px; padding-left:2px; border-bottom:2px solid transparent; }
.wk-day .dname{ font-weight:600; font-size:13.5px; letter-spacing:.005em; }
.wk-day .ddate{ font-family:var(--mono); font-size:11.5px; color:var(--ink-3); }
.wk-day[data-today="1"]{ border-bottom-color:var(--now); }
.wk-day[data-today="1"] .dname{ color:var(--now); }
.wk-day[data-today="1"] .ddate{ color:var(--now); opacity:.85; }
.wk-corner span{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }

.wk-time{
  position:sticky; left:0; z-index:2; background:var(--paper);
  display:flex; flex-direction:column; justify-content:center; gap:1px;
  padding:8px 8px 8px 2px; min-height:96px;
}
.wk-time b{ font-family:var(--disp); font-weight:500; font-size:17px; line-height:1; color:var(--ink-3); }
.wk-time .t{ font-family:var(--mono); font-size:11.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.wk-time .t.e{ color:var(--ink-3); }
.wk-time[data-now="1"] b{ color:var(--now); }

.cell{ display:flex; flex-direction:column; gap:5px; min-height:96px; }

/* ---------- lesson card ---------- */
.ls{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:9px 10px 10px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:5px; flex:1 1 auto;
  position:relative; overflow:hidden; min-width:0;
}
.ls[data-w="den"]{ border-color:var(--den-line); background:linear-gradient(var(--den-soft),var(--den-soft)) padding-box, var(--surface); }
.ls[data-w="num"]{ border-color:var(--pen-line); }
.ls[data-now="1"]{ border-color:var(--now); box-shadow:0 0 0 1px var(--now), var(--shadow-lift); }
.ls-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:16px; }
.chip{
  font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  padding:2px 5px; border-radius:4px; white-space:nowrap; line-height:1.35;
}
.chip-num{ color:var(--pen-ink); background:var(--pen-soft); }
.chip-den{ color:var(--den); background:var(--den-soft); border:1px solid var(--den-line); }
.chip-type{ color:var(--ink-2); background:var(--surface-2); }
.chip-now{ color:var(--on-pen); background:var(--now); }
:root[data-theme="dark"] .chip-now{ color:#0e1311; }
.ls-room{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-3); white-space:nowrap; }
.ls-pre{ font-size:10.5px; line-height:1.3; color:var(--ink-3); letter-spacing:.01em; overflow-wrap:anywhere; }
.ls-subj{ font-size:13.5px; font-weight:600; line-height:1.3; letter-spacing:-.005em; overflow-wrap:anywhere; }
.ls-teacher{ font-size:12px; color:var(--ink-2); line-height:1.35; overflow-wrap:anywhere; }
.ls-note{ font-size:11.5px; color:var(--ink-3); font-style:italic; }
.ls-act{ display:flex; gap:5px; flex-wrap:wrap; margin-top:auto; padding-top:3px; }
.join{
  display:inline-flex; align-items:center; gap:4px; text-decoration:none;
  font-size:11.5px; font-weight:600; padding:4px 8px; border-radius:6px;
  background:var(--pen); color:var(--on-pen); border:1px solid var(--pen);
}
.join:hover{ filter:brightness(1.08); }
.join.alt{ background:var(--surface-2); color:var(--ink-2); border-color:var(--line); }
.join.alt:hover{ filter:none; border-color:var(--line-2); color:var(--ink); }
.copy{
  appearance:none; cursor:pointer; font-size:11.5px; font-family:var(--mono);
  padding:4px 7px; border-radius:6px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2);
}
.copy:hover{ border-color:var(--line-2); color:var(--ink); }
.copy.done{ color:var(--ok); border-color:var(--ok); }
.copy.lock{ border-style:dashed; font-family:var(--sans); font-weight:500; color:var(--ink-3); background:transparent; }
.copy.lock:hover{ border-style:solid; border-color:var(--pen); color:var(--pen-ink); }
.lockicon{ display:inline-block; width:9px; height:11px; margin-right:5px; vertical-align:-1px;
  border:1.5px solid currentColor; border-radius:2px; position:relative; box-sizing:border-box; }
.lockicon::before{ content:""; position:absolute; left:1px; right:1px; bottom:100%; height:5px;
  border:1.5px solid currentColor; border-bottom:0; border-radius:4px 4px 0 0; box-sizing:border-box; }
.ls-progress{ position:absolute; left:0; bottom:0; height:2px; background:var(--now); }

.free{
  border:1px dashed var(--line); border-radius:var(--r); flex:1 1 auto; min-height:96px;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-3); font-size:12px; opacity:.55;
}
.editing .free{ cursor:pointer; opacity:1; }
.editing .free:hover{ border-color:var(--pen); color:var(--pen-ink); background:var(--pen-soft); }
.editing .ls{ cursor:pointer; }
.editing .ls:hover{ border-color:var(--pen); }
.ls-edit{ position:absolute; top:5px; right:5px; display:none; gap:3px; }
.editing .ls .ls-edit{ display:flex; }
.editing .ls .ls-room{ visibility:hidden; }
.icobtn{
  appearance:none; cursor:pointer; width:22px; height:22px; padding:0; border-radius:6px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  display:inline-flex; align-items:center; justify-content:center; font-size:12px; line-height:1;
}
.icobtn:hover{ border-color:var(--line-2); color:var(--ink); }
.icobtn.del:hover{ border-color:var(--now); color:var(--now); }

/* ---------- day view ---------- */
.day-nav{ display:flex; align-items:center; gap:6px; margin-bottom:12px; flex-wrap:wrap; max-width:880px; }
.day-nav .title{ font-family:var(--disp); font-weight:500; font-size:16px; letter-spacing:-.01em; }
.day-nav .date{ font-family:var(--mono); font-size:12.5px; color:var(--ink-3); }
.daylist{ display:flex; flex-direction:column; gap:8px; max-width:880px; }
.drow{ display:grid; grid-template-columns:64px 1fr; gap:12px; align-items:stretch; }
.drow-t{ display:flex; flex-direction:column; padding-top:9px; }
.drow-t b{ font-family:var(--mono); font-size:14px; font-weight:700; letter-spacing:-.03em; }
.drow-t span{ font-family:var(--mono); font-size:11.5px; color:var(--ink-3); letter-spacing:-.03em; }
.drow-t i{ font-style:normal; font-size:10.5px; letter-spacing:.02em; color:var(--ink-3); margin-top:2px; }
.drow[data-now="1"] .drow-t b, .drow[data-now="1"] .drow-t i{ color:var(--now); }
.drow .ls{ min-height:0; }
.drow .ls-subj{ font-size:15px; }
.drow .ls-teacher{ font-size:13px; }
.drow .free{ min-height:52px; }
.dayempty{ max-width:880px; padding:34px 16px; text-align:center; color:var(--ink-2); background:var(--surface); border:1px dashed var(--line); border-radius:var(--r); }
.dayempty b{ display:block; font-family:var(--disp); font-weight:500; font-size:16px; color:var(--ink); margin-bottom:4px; }

/* ---------- editor bar / banners ---------- */
.bar{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
  padding:9px 13px; border-radius:var(--r); margin-bottom:14px; font-size:13px;
  border:1px solid var(--pen-line); background:var(--pen-soft); color:var(--ink);
}
.bar b{ font-weight:600; }
.bar .sp{ flex:1 1 auto; }
.bar.warn{ border-color:var(--den-line); background:var(--den-soft); }
.bar.fresh{ border-color:var(--pen-line); background:var(--pen-soft); }
.bar .hint{ color:var(--ink-2); }

/* ---------- modal ---------- */
.ovl{
  position:fixed; inset:0; z-index:50; background:rgba(12,20,17,.45);
  display:flex; align-items:flex-start; justify-content:center;
  padding:24px 14px; overflow-y:auto; backdrop-filter:blur(2px);
}
.modal{
  background:var(--paper); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow-lift); width:100%; max-width:560px; margin:auto;
}
.modal-h{ display:flex; align-items:center; gap:10px; padding:16px 18px 12px; border-bottom:1px solid var(--line); }
.modal-h h2{ font-family:var(--disp); font-weight:500; font-size:16px; letter-spacing:-.01em; }
.modal-h .sub{ font-family:var(--mono); font-size:12px; color:var(--ink-3); }
.modal-b{ padding:16px 18px; display:flex; flex-direction:column; gap:13px; }
.modal-f{ display:flex; gap:8px; padding:13px 18px 16px; border-top:1px solid var(--line); flex-wrap:wrap; }
.modal-f .sp{ flex:1 1 auto; }
.fld{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.fld > label{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.fld input, .fld select, .fld textarea{
  border:1px solid var(--line); background:var(--surface); border-radius:8px;
  padding:8px 10px; font-size:14px; width:100%; min-width:0;
}
.fld input:focus, .fld select:focus, .fld textarea:focus{ border-color:var(--pen); outline:none; box-shadow:0 0 0 3px var(--pen-soft); }
.fld textarea{ resize:vertical; min-height:56px; font-family:var(--mono); font-size:12.5px; }
.fld .mono{ font-family:var(--mono); font-size:13px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.fhint{ font-size:11.5px; color:var(--ink-3); }
.slots{ display:flex; flex-direction:column; gap:6px; }
.slotrow{ display:grid; grid-template-columns:30px 1fr 1fr 28px; gap:7px; align-items:center; }
.slotrow .n{ font-family:var(--mono); font-size:13px; color:var(--ink-3); text-align:center; }
.slotrow input{ font-family:var(--mono); font-size:13px; padding:6px 8px; }

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:80;
  background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:9px;
  font-size:13.5px; box-shadow:var(--shadow-lift); max-width:min(92vw,520px);
}
.toast.err{ background:var(--now); color:#fff; }

/* ---------- footer ---------- */
.foot{ margin-top:26px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:12px; color:var(--ink-3); }
.foot .sp{ flex:1 1 auto; }
.teachers{ display:flex; flex-wrap:wrap; gap:5px 14px; }
.teachers span{ white-space:nowrap; }
.footbtns{ display:flex; flex-wrap:wrap; gap:6px; }

@media (max-width:820px){
  .wrap{ padding:14px 12px 56px; }
  .mast{ align-items:flex-start; }
  .now{ padding:10px 12px; }
  .drow{ grid-template-columns:54px 1fr; gap:9px; }
  .row2, .row3{ grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ---------- print ---------- */
@media print{
  body{ background:#fff; color:#000; }
  .ctl, .now-join, .ls-act, .bar, .day-nav, .foot .sp, .ovl, .toast, .ls-edit{ display:none !important; }
  .wrap{ max-width:none; padding:0; }
  .scroller{ overflow:visible; }
  .wk{ min-width:0; grid-template-columns:56px repeat(var(--days,6), 1fr); gap:3px; }
  .ls, .free{ box-shadow:none; border-color:#999; page-break-inside:avoid; }
  .ls-subj{ font-size:10.5px; } .ls-teacher{ font-size:9.5px; }
  .wk-time, .wk-day, .wk-corner, .cell{ min-height:0; }
  .now{ box-shadow:none; }
}
</style>
</head>

    var root = $('#root');
    root.className = ui.editing ? 'editing' : '';
    root.innerHTML = shell();
    tickNow();
  }

  function shell() {
    var h = [];
    h.push('<div class="wrap">');
    h.push(masthead());
    h.push(banners());
    h.push('<div class="now" id="nowbar"></div>');
    h.push(ui.view === 'week' ? weekView() : dayView());
    h.push(footer());
    h.push('</div>');
    return h.join('');
  }

  function masthead() {
    var p = effParity(), real = parityOf(new Date());
    var sub = [];
    if (state.org) sub.push(esc(state.org));
    if (state.year) sub.push(esc(state.year) + ' н. р.');
    sub.push(state.semester + '-й семестр');
    var mon = shownMonday();
    sub.push('тиждень ' + ddmm(mon) + '–' + ddmm(addDays(mon, state.days.length - 1)));

    var h = [];
    h.push('<header class="mast">');
    h.push('<div class="mast-id"><h1>Розклад <span class="grp">' + esc(state.group) + '</span></h1>');
    h.push('<div class="mast-sub">' + sub.join(' · ') + '</div></div>');
    h.push('<div class="mast-spacer"></div>');
    h.push('<div class="ctl">');
    h.push('<div class="seg parity" role="group" aria-label="Тиждень">');
    ['num', 'den'].forEach(function (k) {
      h.push('<button type="button" data-act="parity" data-p="' + k + '" aria-pressed="' + (p === k) + '">' +
        WEEK_LABEL[k] + (real === k ? '<span class="auto">зараз</span>' : '') + '</button>');
    });
    h.push('</div>');
    h.push('<div class="seg" role="group" aria-label="Вигляд">');
    h.push('<button type="button" data-act="view" data-v="week" aria-pressed="' + (ui.view === 'week') + '">Тиждень</button>');
    h.push('<button type="button" data-act="view" data-v="day" aria-pressed="' + (ui.view === 'day') + '">День</button>');
    h.push('</div>');
    h.push('<button type="button" class="btn btn-ghost" data-act="today">Сьогодні</button>');
    if (isLocked()) h.push('<button type="button" class="btn" data-act="unlock"><span class="lockicon"></span>Розблокувати</button>');
    else if (hasVault()) h.push('<button type="button" class="btn btn-ghost" data-act="relock" title="Прибрати пароль із цього браузера"><span class="lockicon"></span>Заблокувати</button>');
    h.push('<button type="button" class="btn' + (ui.editing ? ' btn-primary' : '') + '" data-act="toggle-edit">' +
      (ui.editing ? 'Готово' : 'Редагувати') + '</button>');
    h.push('</div></header>');
    return h.join('');
  }

  function filledDays() {
    var seen = {};
    state.lessons.forEach(function (l) { seen[l.day] = 1; });
    return Object.keys(seen).length;
  }

  function banners() {
    var h = [];
    if (ui.staleCode && !ui.editing) {
      h.push('<div class="bar warn"><b>Ця вкладка працює на старій версії сторінки.</b>');
      h.push('<span class="hint">Перезавантажте, щоб бачити актуальний розклад і мати змогу зберігати.</span>');
      h.push('<span class="sp"></span><button type="button" class="btn btn-sm" data-act="reload">Перезавантажити</button></div>');
      return h.join('');
    }
    if (ui.editing) {
      var noKey = !artifactApi && ghEnabled() && !ghToken();
      h.push('<div class="bar' + (noKey ? ' warn' : '') + '"><b>Режим редагування</b>');
      h.push('<span class="hint">' + (noKey
        ? 'Зміни побачите лише ви — вони зникнуть після закриття вкладки. Щоб зберегти розклад для всіх, потрібен токен GitHub.'
        : 'Натисніть на пару, щоб змінити, або на порожню клітинку, щоб додати.') + '</span>');
      h.push('<span class="sp"></span>');
      h.push('<button type="button" class="btn btn-sm btn-ghost" data-act="settings">Налаштування</button>');
      if (ui.staleCode) {
        h.push('<span class="sp"></span><button type="button" class="btn btn-sm" data-act="reload">Перезавантажити</button>');
      } else if (canSave() && !ui.readOnly) {
        if (!artifactApi && ghEnabled()) {
          h.push('<button type="button" class="btn btn-sm btn-ghost" data-act="token">' + (ghToken() ? 'Токен ✓' : 'Токен') + '</button>');
        }
        h.push('<button type="button" class="btn btn-sm btn-primary" data-act="save"' + (ui.saving ? ' disabled' : '') + '>' +
          (ui.saving ? 'Збереження…' : 'Зберегти для всіх') + '</button>');
      } else if (capsResolved >= 2 || ui.readOnly) {
        h.push('<span class="hint">Збереження недоступне тут — зробіть резервну копію .json</span>');
        h.push('<button type="button" class="btn btn-sm" data-act="export-json">Копія .json</button>');
      }
      h.push('</div>');
    } else if (filledDays() < 2) {
      h.push('<div class="bar"><b>Заповнено лише ' + filledDays() + ' ' + (filledDays() === 1 ? 'день' : 'дні') + ' з ' + state.days.length + '.</b>');
      h.push('<span class="hint">У вихідному документі решта тижня порожня — додайте пари через «Редагувати».</span>');
      h.push('<span class="sp"></span><button type="button" class="btn btn-sm" data-act="toggle-edit">Редагувати</button></div>');
    } else if (ui.staleCode) {
      h.push('<div class="bar warn"><b>Ця вкладка працює на старій версії сторінки.</b>');
      h.push('<span class="hint">Збереження вимкнено: воно відкотило б свіжі зміни для всіх. Перезавантажте — незбережене зникне.</span>');
      h.push('<span class="sp"></span><button type="button" class="btn btn-sm" data-act="reload">Перезавантажити</button></div>');
    } else if (ui.stale) {
      h.push('<div class="bar fresh"><b>Розклад оновили в іншому місці.</b>');
      h.push('<span class="hint">Ваші зміни ще тут. Перезавантажте сторінку, коли будете готові — незбережене зникне.</span>');
      h.push('<span class="sp"></span><button type="button" class="btn btn-sm" data-act="reload">Перезавантажити</button></div>');
    } else if (ui.dirty) {
      h.push('<div class="bar warn"><b>Є незбережені зміни.</b><span class="hint">Вони видимі лише вам, доки не збережете.</span>');
      h.push('<span class="sp"></span><button type="button" class="btn btn-sm" data-act="toggle-edit">Відкрити редактор</button></div>');
    }
    return h.join('');
  }

  /* ---------- week ---------- */
  function weekView() {
    var p = effParity(), mon = shownMonday(), ti = todayIndex(), cw = isCurrentWeek();
    var info = nowInfo();
    var h = [];
    h.push('<div class="scroller"><div class="wk" style="--days:' + state.days.length + '">');
    h.push('<div class="wk-corner"><span>Пара</span></div>');
    state.days.forEach(function (d, i) {
      var today = cw && i === ti;
      h.push('<div class="wk-day"' + (today ? ' data-today="1"' : '') + '><span class="dname">' + esc(d) +
        '</span><span class="ddate">' + ddmm(addDays(mon, i)) + '</span></div>');
    });
    state.slots.forEach(function (s) {
      var isNowSlot = cw && info.slot && info.slot.n === s.n;
      h.push('<div class="wk-time"' + (isNowSlot ? ' data-now="1"' : '') + '><b>' + s.n +
        '</b><span class="t">' + esc(s.start) + '</span><span class="t e">' + esc(s.end) + '</span></div>');
      state.days.forEach(function (d, i) {
        var items = lessonsAt(i, s.n, p);
        h.push('<div class="cell" data-day="' + i + '" data-slot="' + s.n + '">');
        if (items.length) {
          items.forEach(function (l) {
            h.push(card(l, { now: cw && isNowSlot && i === ti && info.lesson && info.lesson.id === l.id, progress: info.progress, compact: true }));
          });
        } else if (ui.editing) {
          h.push('<div class="free" data-act="add" data-day="' + i + '" data-slot="' + s.n + '">+</div>');
        }
        h.push('</div>');
      });
    });
    h.push('</div></div>');
    return h.join('');
  }

  /* ---------- day ---------- */
  function dayView() {
    var p = effParity(), mon = shownMonday(), cw = isCurrentWeek();
    var di = ui.day == null ? Math.min(todayIndex(), state.days.length - 1) : ui.day;
    var info = nowInfo();
    var date = addDays(mon, di);
    var any = state.slots.some(function (s) { return lessonsAt(di, s.n, p).length; });
    var h = [];
    h.push('<div class="day-nav">');
    h.push('<button type="button" class="btn btn-sm" data-act="day-step" data-d="-1" aria-label="Попередній день">‹</button>');
    h.push('<button type="button" class="btn btn-sm" data-act="day-step" data-d="1" aria-label="Наступний день">›</button>');
    h.push('<span class="title">' + esc(state.days[di]) + '</span><span class="date">' + ddmm(date) + '</span>');
    h.push('<span class="sp" style="flex:1"></span>');
    h.push('<div class="seg" role="group" aria-label="День">');
    state.days.forEach(function (d, i) {
      h.push('<button type="button" data-act="day-pick" data-i="' + i + '" aria-pressed="' + (i === di) + '">' + esc(d.slice(0, 2)) + '</button>');
    });
    h.push('</div></div>');

    if (!any && !ui.editing) {
      h.push('<div class="dayempty"><b>Пар немає</b>' + esc(state.days[di]) + ', ' + WEEK_LABEL[p].toLowerCase() + ' — вільний день.</div>');
      return h.join('');
    }
    h.push('<div class="daylist">');
    state.slots.forEach(function (s) {
      var items = lessonsAt(di, s.n, p);
      if (!items.length && !ui.editing) return;
      var isNow = cw && info.slot && info.slot.n === s.n && di === todayIndex();
      h.push('<div class="drow"' + (isNow ? ' data-now="1"' : '') + '>');
      h.push('<div class="drow-t"><b>' + esc(s.start) + '</b><span>' + esc(s.end) + '</span><i>' + s.n + '-ша</i></div>');
      h.push('<div class="cell" data-day="' + di + '" data-slot="' + s.n + '">');
      if (items.length) {
        items.forEach(function (l) {
          h.push(card(l, { now: isNow && info.lesson && info.lesson.id === l.id, progress: info.progress, compact: false }));
        });
      } else {
        h.push('<div class="free" data-act="add" data-day="' + di + '" data-slot="' + s.n + '">+</div>');
      }
      h.push('</div></div>');
    });
    h.push('</div>');
    return h.join('');
  }

  /* ---------- lesson card ---------- */
  function card(l, o) {
    var h = [];
    h.push('<article class="ls" data-w="' + l.week + '" data-id="' + esc(l.id) + '"' + (o.now ? ' data-now="1"' : '') + '>');
    h.push('<div class="ls-edit"><button type="button" class="icobtn" data-act="edit" data-id="' + esc(l.id) + '" title="Змінити" aria-label="Змінити">✎</button>' +
      '<button type="button" class="icobtn del" data-act="del" data-id="' + esc(l.id) + '" title="Видалити" aria-label="Видалити">✕</button></div>');
    h.push('<div class="ls-top">');
    if (o.now) h.push('<span class="chip chip-now">Зараз</span>');
    if (l.week !== 'both') h.push('<span class="chip chip-' + l.week + '">' + WEEK_SHORT[l.week] + '</span>');
    if (l.kind) h.push('<span class="chip chip-type">' + esc(l.kind) + '</span>');
    if (l.room) h.push('<span class="ls-room">' + esc(l.room) + '</span>');
    h.push('</div>');
    var sub = splitSubject(l.subject);
    if (sub.pre) h.push('<p class="ls-pre">' + esc(sub.pre) + '</p>');
    h.push('<h3 class="ls-subj">' + esc(sub.main || 'Без назви') + '</h3>');
    if (l.teacher) h.push('<p class="ls-teacher" title="' + esc(l.teacher) + '">' + esc(o.compact ? shortName(l.teacher) : l.teacher) + '</p>');
    if (l.note) h.push('<p class="ls-note">' + esc(l.note) + '</p>');
    if (!ui.editing && l.locked && isLocked()) {
      h.push('<div class="ls-act"><button type="button" class="copy lock" data-act="unlock"><span class="lockicon"></span>Посилання</button></div>');
    } else if (!ui.editing && (l.link || l.classroom || l.meetingId || l.passcode)) {
      h.push('<div class="ls-act">');
      if (l.link) h.push('<a class="join" href="' + esc(l.link) + '" target="_blank" rel="noopener noreferrer">Приєднатися</a>');
      if (isUrl(l.classroom)) h.push('<a class="join alt" href="' + esc(l.classroom) + '" target="_blank" rel="noopener noreferrer">Classroom</a>');
      else if (l.classroom) h.push('<button type="button" class="copy" data-act="copy" data-val="' + esc(l.classroom) + '" title="Скопіювати код класу Google Classroom">Клас</button>');
      if (l.meetingId) h.push('<button type="button" class="copy" data-act="copy" data-val="' + esc(l.meetingId.replace(/\s/g, '')) + '" title="Скопіювати ID конференції">ID</button>');
      if (l.passcode) h.push('<button type="button" class="copy" data-act="copy" data-val="' + esc(l.passcode) + '" title="Скопіювати код доступу">Код</button>');
      h.push('</div>');
    }
    if (o.now) h.push('<div class="ls-progress" style="width:' + Math.round(o.progress * 100) + '%"></div>');
    h.push('</article>');
    return h.join('');
  }

  /* ---------- footer ---------- */
  function footer() {
    var names = [];
    state.lessons.forEach(function (l) { if (l.teacher && names.indexOf(l.teacher) < 0) names.push(l.teacher); });
    names.sort(function (a, b) { return a.localeCompare(b, 'uk'); });
    var h = [];
    h.push('<footer class="foot">');
    if (names.length) {
      h.push('<div class="teachers">' + names.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + '</div>');
    }
    h.push('<span class="sp"></span>');
    h.push('<div class="footbtns">');
    h.push('<button type="button" class="btn btn-sm btn-ghost" data-act="settings">Налаштування</button>');
    h.push('<button type="button" class="btn btn-sm btn-ghost" data-act="ics">Календар .ics</button>');
    h.push('<button type="button" class="btn btn-sm btn-ghost" data-act="export-json">Копія .json</button>');
    h.push('<button type="button" class="btn btn-sm btn-ghost" data-act="import-json">Імпорт</button>');
    h.push('<button type="button" class="btn btn-sm btn-ghost" data-act="print">Друк</button>');
    h.push('</div></footer>');
    return h.join('');
  }

  /* ---------- live status ---------- */
  var lastKey = '';
  function tickNow() {
    var bar = document.getElementById('nowbar');
    if (!bar) return;
    var info = nowInfo();
    var key = info.dayIndex + '|' + (info.slot ? info.slot.n : '-') + '|' + (info.lesson ? info.lesson.id : '-') + '|' + info.parity;
    var changed = lastKey !== '' && lastKey !== key;
    lastKey = key;
    if (changed) { renderApp(); return; }
    bar.innerHTML = nowbarHtml(info);
    bar.setAttribute('data-live', info.lesson ? '1' : (info.next ? 'next' : '0'));
    var w = Math.round(info.progress * 100) + '%';
    var pr = document.querySelector('.ls[data-now="1"] .ls-progress');
    if (pr) pr.style.width = w;
  }

  function nowbarHtml(info) {
    var h = [], now = info.now;
    var clock = '<span class="now-spacer"></span><span class="now-clock">' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + '</span>';
    if (info.lesson) {
      var left = toMin(info.slot.end) - info.mins;
      h.push('<span class="now-tag">Зараз</span>');
      h.push('<span class="now-main">' + esc(info.lesson.subject) + '</span>');
      h.push('<span class="now-meta"><span class="mono">' + esc(info.slot.start) + '–' + esc(info.slot.end) + '</span> · лишилось ' + humanMin(left) + '</span>');
      if (info.lesson.locked && isLocked()) h.push('<button type="button" class="btn btn-sm now-join" data-act="unlock"><span class="lockicon"></span>Розблокувати</button>');
      else if (primaryLink(info.lesson)) h.push('<a class="join now-join" href="' + esc(primaryLink(info.lesson)) + '" target="_blank" rel="noopener noreferrer">' + (info.lesson.link ? 'Приєднатися' : 'Classroom') + '</a>');
      h.push(clock);
      h.push('<div class="now-bar" style="width:' + Math.round(info.progress * 100) + '%"></div>');
      return h.join('');
    }
    if (info.next) {
      var n = info.next;
      var when = n.offset === 0 ? 'сьогодні' : (n.offset === 1 ? 'завтра' : state.days[(n.date.getDay() + 6) % 7] || DAY_NAMES[(n.date.getDay() + 6) % 7]);
      h.push('<span class="now-tag">' + (n.offset === 0 && info.slot ? 'Перерва' : 'Наступна пара') + '</span>');
      h.push('<span class="now-main">' + esc(n.lesson.subject) + '</span>');
      h.push('<span class="now-meta">' + when + ' о <span class="mono">' + esc(n.slot.start) + '</span>' +
        (n.mins < 600 ? ' · через ' + humanMin(n.mins) : '') + '</span>');
      if (n.offset === 0 && n.mins <= 20 && primaryLink(n.lesson)) h.push('<a class="join now-join" href="' + esc(primaryLink(n.lesson)) + '" target="_blank" rel="noopener noreferrer">' + (n.lesson.link ? 'Приєднатися' : 'Classroom') + '</a>');
      h.push(clock);
      return h.join('');
    }
    h.push('<span class="now-tag">Розклад</span><span class="now-main">Найближчих пар немає</span>');
    h.push('<span class="now-meta">Додайте заняття або перевірте налаштування семестру.</span>');
    h.push(clock);
    return h.join('');
  }

  /* ---------- modal shell ---------- */
  function openModal(html, onMount) {
    var layer = $('#layer');
    layer.innerHTML = '<div class="ovl" data-act="ovl"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
    if (onMount) onMount(layer);
    var f = layer.querySelector('input,select,textarea,button');
    if (f) f.focus();
  }
  function closeModal() { $('#layer').innerHTML = ''; }

  function toast(msg, isErr) {
    var el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, isErr ? 6000 : 3000);
  }

      return '<option value="' + s.n + '"' + (s.n === l.slot ? ' selected' : '') + '>' + s.n + ' · ' + esc(s.start) + '</option>';
    }).join('');
    var dayOpts = state.days.map(function (d, i) {
      return '<option value="' + i + '"' + (i === l.day ? ' selected' : '') + '>' + esc(d) + '</option>';
    }).join('');
    var weekOpts = ['both', 'num', 'den'].map(function (k) {
      return '<option value="' + k + '"' + (k === l.week ? ' selected' : '') + '>' + WEEK_LABEL[k] + '</option>';
    }).join('');
    var kindOpts = KINDS.map(function (k) {
      return '<option value="' + esc(k) + '"' + (k === l.kind ? ' selected' : '') + '>' + (k || '— без типу —') + '</option>';
    }).join('');
    var h = [];
    h.push('<div class="modal-h"><h2>' + (isNew ? 'Нова пара' : 'Пара') + '</h2><span class="sub">' +

    h.push('<form class="modal-b" id="lform">');

      '<span class="fhint">Частина до « / » показується дрібним написом над назвою — зручно для вибіркових компонент.</span></div>');
    h.push('<div class="fld"><label for="f-teacher">Викладач</label><input id="f-teacher" name="teacher" value="' + esc(l.teacher) + '" placeholder="Прізвище Ім\'я По батькові"></div>');
    h.push('<div class="row3">');
    h.push('<div class="fld"><label for="f-day">День</label><select id="f-day" name="day">' + dayOpts + '</select></div>');
    h.push('<div class="fld"><label for="f-slot">Пара</label><select id="f-slot" name="slot">' + slotOpts + '</select></div>');

    h.push('</div>');
    h.push('<div class="row2">');
    h.push('<div class="fld"><label for="f-kind">Тип</label><select id="f-kind" name="kind">' + kindOpts + '</select></div>');
    h.push('<div class="fld"><label for="f-room">Аудиторія</label><input id="f-room" name="room" value="' + esc(l.room) + '" placeholder="напр. Каф. або 312"></div>');
    h.push('</div>');
    h.push('<div class="fld"><label for="f-link">Посилання на конференцію</label><input id="f-link" name="link" class="mono" value="' + esc(l.link) + '" placeholder="https://…" inputmode="url"></div>');
    h.push('<div class="fld"><label for="f-cr">Google Classroom</label><input id="f-cr" name="classroom" class="mono" value="' + esc(l.classroom) + '" placeholder="посилання або код класу"></div>');
    h.push('<div class="row2">');
    h.push('<div class="fld"><label for="f-mid">ID конференції</label><input id="f-mid" name="meetingId" class="mono" value="' + esc(l.meetingId) + '"></div>');
    h.push('<div class="fld"><label for="f-pass">Код доступу</label><input id="f-pass" name="passcode" class="mono" value="' + esc(l.passcode) + '"></div>');

  /* ---------- clipboard ---------- */
  function copyText(v, btn) {
    function done() {
      if (!btn) { toast('Скопійовано'); return; }
      var old = btn.textContent;
      btn.classList.add('done'); btn.textContent = '✓';
      setTimeout(function () { btn.classList.remove('done'); btn.textContent = old; }, 1200);
    }
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = v; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) { }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(done, function () { legacy(); done(); });
    } else { legacy(); done(); }
  }

  /* ---------- dirty / draft ---------- */
  function markDirty() {
    ui.dirty = true;
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) { }
  }
  function clearDraft() { try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) { } }

  /* ---------- посилання під паролем ---------- */
  var SECRET_FIELDS = ['link', 'classroom', 'meetingId', 'passcode'];
  var PASS_KEY = 'rozklad-pass';
  var KDF_ITER = 250000;
  var vaultPass = null;
  var unlocked = false;

  function hasVault() { return !!(state.vault && state.vault.ct); }
  function isLocked() { return hasVault() && !unlocked; }
  function cryptoOk() { return !!(window.crypto && window.crypto.subtle && window.TextEncoder); }

  function b64e(buf) {
    var b = new Uint8Array(buf), out = '', CH = 0x8000;
    for (var i = 0; i < b.length; i += CH) out += String.fromCharCode.apply(null, b.subarray(i, i + CH));
    return btoa(out);
  }
  function b64d(str) {
    var bin = atob(String(str || '')), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function deriveKey(pass, salt, iter) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: iter || KDF_ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }

  function unlockWith(pass) {
    var v = state.vault;
    return deriveKey(pass, b64d(v.salt), v.iter).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(v.iv) }, key, b64d(v.ct));
    }).then(function (pt) {
      var secrets = JSON.parse(new TextDecoder().decode(pt));
      state.lessons.forEach(function (l) {
        var sec = secrets[l.id];
        if (sec) SECRET_FIELDS.forEach(function (f) { l[f] = sec[f] || ''; });
      });
      vaultPass = pass; unlocked = true;
    });
  }

  /* Готує копію стану для запису: секрети виймаються з занять і шифруються. */
  function sealState() {
    var clone = JSON.parse(JSON.stringify(state));
    if (!vaultPass) { delete clone.vault; return Promise.resolve(clone); }
    var secrets = {};
    clone.lessons.forEach(function (l) {
      var sec = {}, any = false;
      SECRET_FIELDS.forEach(function (f) { if (l[f]) { sec[f] = l[f]; any = true; } l[f] = ''; });
      l.locked = any;
      if (any) secrets[l.id] = sec;
    });
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(vaultPass, salt, KDF_ITER).then(function (key) {
      return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key,
        new TextEncoder().encode(JSON.stringify(secrets)));
    }).then(function (ct) {
      clone.vault = { v: 1, kdf: 'PBKDF2-SHA256', iter: KDF_ITER, salt: b64e(salt), iv: b64e(iv), ct: b64e(ct) };
      return clone;
    });
  }

  function rememberPass(pass) { try { if (pass) localStorage.setItem(PASS_KEY, pass); else localStorage.removeItem(PASS_KEY); } catch (e) { } }
  function savedPass() { try { return localStorage.getItem(PASS_KEY) || ''; } catch (e) { return ''; } }

  /* Замикає сторінку назад і прибирає пароль із цього браузера.
     Сховище лишається недоторканим — розблокувати можна знову тим самим паролем. */
  function relock() {
    if (ui.dirty && !window.confirm('Є незбережені зміни — вони зникнуть. Заблокувати?')) return;
    SECRET_FIELDS.forEach(function (f) {
      state.lessons.forEach(function (l) { if (l.locked) l[f] = ''; });
    });
    vaultPass = null; unlocked = false; ui.editing = false;
    rememberPass(''); clearDraft(); ui.dirty = false;
    renderApp();
    toast('Заблоковано. Пароль прибрано з цього браузера.');
  }

  function dropPass() {
    vaultPass = null; unlocked = true; delete state.vault;
    state.lessons.forEach(function (l) { delete l.locked; });
    rememberPass(''); markDirty(); closeModal(); renderApp();
    toast('Пароль знято. Після збереження посилання будуть відкриті всім.');
  }

  /* ---------- GitHub Pages backend ---------- */
  function ghEnabled() { return !!(GH && GH.owner && GH.repo); }
  function ghToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function ghSetToken(t) {
    try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { }
  }
  function canSave() { return !!artifactApi || ghEnabled(); }

  function b64utf8(str) {
    var bytes = new TextEncoder().encode(str), bin = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin);
  }

  function ghFetch(path, opts) {
    opts = opts || {};
    return fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + path, {
      method: opts.method || 'GET',
      cache: 'no-store',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + ghToken(),
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }

  function tokenModal() {
    var has = !!ghToken();
    var h = [];
    h.push('<div class="modal-h"><h2>Доступ до GitHub</h2><span class="sub">' + esc(GH.owner + '/' + GH.repo) + '</span></div>');
    h.push('<form class="modal-b" id="tform">');
    h.push('<div class="fld"><span class="fhint">Щоб зберігати зміни для всіх, потрібен персональний токен GitHub із правом запису в цей репозиторій. ' +
      'Створіть <b>fine-grained token</b> на <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">github.com/settings/personal-access-tokens</a>: ' +
      'Repository access → <b>' + esc(GH.repo) + '</b>, Permissions → Contents → <b>Read and write</b>.</span></div>');
    h.push('<div class="fld"><label for="t-tok">Токен</label>' +
      '<input id="t-tok" name="token" type="password" class="mono" autocomplete="off" spellcheck="false" placeholder="github_pat_…"' + (has ? ' value=""' : '') + '></div>');
    h.push('<div class="fld"><span class="fhint">Токен зберігається лише у <b>вашому</b> браузері (localStorage) і ніколи не потрапляє у файл сторінки. ' +
      'На чужому комп\'ютері після роботи натисніть «Забути токен».</span></div>');
    h.push('</form>');
    h.push('<div class="modal-f">');
    if (has) h.push('<button type="button" class="btn btn-danger" data-act="forget-token">Забути токен</button>');
    h.push('<span class="sp"></span><button type="button" class="btn btn-ghost" data-act="close">Скасувати</button>');
    h.push('<button type="submit" form="tform" class="btn btn-primary">Зберегти токен</button></div>');
    openModal(h.join(''), function (layer) {
      layer.querySelector('#tform').addEventListener('submit', function (e) {
        e.preventDefault();
        var v = String(new FormData(e.target).get('token') || '').trim();
        if (!v) { toast('Порожній токен.', true); return; }
        ghSetToken(v); closeModal(); renderApp();
        toast('Токен збережено. Тепер натисніть «Зберегти для всіх».');
      });
    });
  }

  function ghError(status, message) {
    if (status === 401) return 'Токен недійсний або протермінований. Створіть новий і вставте його ще раз.';
    if (status === 403) return 'Токену бракує прав (потрібно Contents: Read and write) або спрацював ліміт запитів GitHub.';
    if (status === 404) return 'GitHub не бачить ' + GH.owner + '/' + GH.repo + '. Перевірте назву репозиторію та права токена.';
    if (status === 422) return 'GitHub відхилив запис: ' + (message || 'перевірте гілку ' + GH.branch + '.');
    return 'GitHub відповів помилкою ' + status + (message ? ': ' + message : '');
  }

  function saveToGithub(content, isRetry) {
    if (!ghToken()) { ui.saving = false; renderApp(); tokenModal(); return; }
    ghFetch('/contents/' + GH.path + '?ref=' + encodeURIComponent(GH.branch)).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
        throw { status: r.status, message: j && j.message };
      });
      return r.json();
    }).then(function (cur) {
      return ghFetch('/contents/' + GH.path, {
        method: 'PUT',
        body: {
          message: 'Розклад ' + state.group + ' — оновлено ' + isoOf(new Date()),
          content: b64utf8(content),
          branch: GH.branch,
          sha: cur && cur.sha ? cur.sha : undefined
        }
      });
    }).then(function (r) {
      if (r.status === 409 && !isRetry) { saveToGithub(content, true); return null; }
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
        throw { status: r.status, message: j && j.message };
      });
      ui.saving = false; ui.dirty = false; clearDraft(); renderApp();
      toast('Збережено. GitHub Pages оновить сторінку приблизно за хвилину.');
      return null;
    }).catch(function (e) {
      ui.saving = false; renderApp();
      if (e && e.status) toast(ghError(e.status, e.message), true);
      else toast('Не вдалося звʼязатися з GitHub — перевірте інтернет.', true);
    });
  }

  /* ---------- publish ---------- */
  function docTitle() { return 'Розклад ' + state.group; }

  function buildDoc(st) {
    var css = document.getElementById('app-css').textContent;
    var js = document.getElementById('app-js').textContent;
    var data = JSON.stringify(st || state, null, 1).replace(/</g, '\\u003c');
    var S = 'scr' + 'ipt';
    return '<!doctype html>\n<html lang="uk">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<meta name="robots" content="noindex, nofollow">\n' +
      '<title>' + esc(docTitle()) + '</title>\n' +
      '<link rel="stylesheet" href="' + FONT_HREF + '">\n' +
      '<style id="app-css">' + css + '</style>\n</head>\n<body>\n' +
      '<div id="root"></div>\n<div id="layer"></div>\n' +
      '<' + S + ' id="app-data" type="application/json">\n' + data + '\n</' + S + '>\n' +
      '<' + S + ' id="app-js">' + js + '</' + S + '>\n</body>\n</html>\n';
  }

  function saveAll() {
    if (ui.staleCode) {
      toast('Ця вкладка на старій версії сторінки — перезавантажте перед збереженням.', true);
      return;
    }
    if (isLocked()) { passModal('unlock'); return; }
    if (!canSave()) { toast('Збереження недоступне в цьому перегляді. Зробіть резервну копію .json.', true); return; }
    ui.saving = true; renderApp();
    try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) { }
    sealState().then(function (sealed) {
      var doc = buildDoc(sealed);
      expectRaw = JSON.stringify(sealed, null, 1).replace(/</g, '\\u003c');
      if (!artifactApi && ghEnabled()) { saveToGithub(doc, false); return; }
      publishArtifact(doc);
    }, function () {
      ui.saving = false; renderApp();
      toast('Не вдалося зашифрувати посилання — браузер не дає доступ до WebCrypto.', true);
    });
  }

  function publishArtifact(doc) {
    artifactApi.publish(doc).then(function () {
      clearDraft();
      ui.saving = false; ui.dirty = false; renderApp();
      toast('Збережено. Усі, хто відкрив сторінку, побачать нову версію.');
    }, function (err) {
      ui.saving = false;
      var code = err && err.code;
      if (code === 'conflict') {
        toast('Хтось зберіг зміни раніше — сторінка оновиться до останньої версії.');
      } else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required' || code === 'capability_disabled') {
        ui.readOnly = true;
        toast('У цьому перегляді розклад лише для читання. Зміни лишились у вас — збережіть копію .json.', true);
      } else if (code === 'rate_limited') {
        toast('Забагато збережень поспіль. Зачекайте хвилину і спробуйте ще раз.', true);
      } else if (code === 'too_large') {
        toast('Сторінка завелика для збереження. Приберіть частину даних.', true);
      } else {
        toast('Не вдалося зберегти: ' + ((err && err.message) || 'спробуйте ще раз'), true);
      }
      renderApp();
    });
  }

  /* ---------- files ---------- */
  function saveFile(filename, text, fallbackTitle, fallbackHint) {
    if (dl) {
      dl.save({ filename: filename, data: text }).then(function () { }, function (err) {
        var code = err && err.code;
        if (code === 'declined') return;
        textModal(fallbackTitle, fallbackHint, text);
      });
      return;
    }
    textModal(fallbackTitle, fallbackHint, text);
  }

  function exportJson() {
    var text = JSON.stringify(state, null, 2);
    saveFile('rozklad-' + state.group.replace(/[^\wА-Яа-яЇїІіЄєҐґ-]+/g, '_') + '.json', text,
      'Резервна копія', 'Скопіюйте цей текст і збережіть у файл — його можна повернути через «Імпорт».');
  }

  function importJson() {
    textModal('Імпорт розкладу',
      'Оберіть файл або вставте JSON. Файл із ключем <b>patch</b> оновлює лише перелічені пари; повний розклад (ключ <b>lessons</b>) замінює все.',
      '', { importer: true });
  }

  /* Точкове оновлення: збігом за id, інакше за днем+парою+тижнем, інакше нове заняття. */
  function applyPatch(items) {
    var updated = 0, added = 0;
    items.forEach(function (pt) {
      if (!pt || typeof pt !== 'object') return;
      var hit = null;
      if (pt.id) hit = state.lessons.filter(function (l) { return l.id === pt.id; })[0];
      if (!hit && pt.day != null && pt.slot != null) {
        hit = state.lessons.filter(function (l) {
          return l.day === +pt.day && l.slot === +pt.slot && l.week === (pt.week || 'both');
        })[0];
      }
      if (hit) {
        Object.keys(pt).forEach(function (k) { if (k !== 'id') hit[k] = pt[k]; });
        updated++;
      } else {
        state.lessons.push(Object.assign({ id: pt.id || uid(), week: 'both' }, pt));
        added++;
      }
    });
    state = normalize(state);
    markDirty(); closeModal(); renderApp();
    toast('Оновлено пар: ' + updated + (added ? ', додано: ' + added : '') + '. Не забудьте зберегти.');
  }

  function doImport() {
    var ta = document.querySelector('#tarea');
    if (!ta) return;
    var parsed;
    try { parsed = JSON.parse(ta.value); } catch (e) {
      toast('Не схоже на JSON: ' + e.message, true); return;
    }
    if (!parsed || typeof parsed !== 'object') { toast('Не схоже на розклад.', true); return; }
    // Імпорт наосліп стер би зашифровані посилання решти пар.
    if (isLocked()) { toast('Спочатку розблокуйте посилання — інакше імпорт зітре їх.', true); passModal('unlock'); return; }
    if (Array.isArray(parsed.patch)) { applyPatch(parsed.patch); return; }
    if (!Array.isArray(parsed.lessons)) { toast('У файлі немає ні patch, ні lessons.', true); return; }
    state = normalize(parsed);
    markDirty(); closeModal(); ui.parity = null; renderApp();
    toast('Імпортовано ' + state.lessons.length + ' занять. Не забудьте зберегти.');
  }

  /* ---------- ICS ---------- */
  function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/[;,]/g, function (c) { return '\\' + c; }).replace(/\r?\n/g, '\\n'); }
  function fold(line) {
    var enc = new TextEncoder(), out = [], cur = '', len = 0;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i], b = enc.encode(ch).length;
      if (len + b > 73) { out.push(cur); cur = ' '; len = 1; }
      cur += ch; len += b;
    }
    out.push(cur);
    return out.join('\r\n');
  }
  function stamp(d, hhmm) {
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + 'T' + String(hhmm).replace(':', '') + '00';
  }
  function firstDateFor(l) {
    var mon = mondayOf(parseISO(state.weekStart));
    for (var k = 0; k < 3; k++) {
      var m = addDays(mon, k * 7);
      if (l.week === 'both' || parityOf(m) === l.week) return addDays(m, l.day);
    }
    return addDays(mon, l.day);
  }
  function buildIcs() {
    var endISO = state.semesterEnd || isoOf(addDays(mondayOf(parseISO(state.weekStart)), 18 * 7));
    var endD = parseISO(endISO);
    var until = new Date(endD.getFullYear(), endD.getMonth(), endD.getDate(), 23, 59, 59);
    var untilUtc = until.getUTCFullYear() + pad2(until.getUTCMonth() + 1) + pad2(until.getUTCDate()) + 'T' +
      pad2(until.getUTCHours()) + pad2(until.getUTCMinutes()) + pad2(until.getUTCSeconds()) + 'Z';
    var now = new Date();
    var dtstamp = now.getUTCFullYear() + pad2(now.getUTCMonth() + 1) + pad2(now.getUTCDate()) + 'T' +
      pad2(now.getUTCHours()) + pad2(now.getUTCMinutes()) + pad2(now.getUTCSeconds()) + 'Z';
    var L = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Rozklad//' + state.group + '//UK',
      'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'X-WR-CALNAME:' + icsEscape(docTitle()), 'X-WR-TIMEZONE:Europe/Kyiv',
      'BEGIN:VTIMEZONE', 'TZID:Europe/Kyiv',
      'BEGIN:STANDARD', 'DTSTART:19701025T040000', 'TZOFFSETFROM:+0300', 'TZOFFSETTO:+0200',
      'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'TZNAME:EET', 'END:STANDARD',
      'BEGIN:DAYLIGHT', 'DTSTART:19700329T030000', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0300',
      'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'TZNAME:EEST', 'END:DAYLIGHT',
      'END:VTIMEZONE'
    ];
    state.lessons.forEach(function (l) {
      var slot = state.slots.filter(function (s) { return s.n === l.slot; })[0];
      if (!slot) return;
      var d0 = firstDateFor(l);
      var desc = [];
      if (l.teacher) desc.push(l.teacher);
      if (l.kind) desc.push(l.kind);
      if (l.week !== 'both') desc.push(WEEK_LABEL[l.week]);
      if (l.link) desc.push(l.link);
      if (l.classroom) desc.push(isUrl(l.classroom) ? 'Classroom: ' + l.classroom : 'Код класу Classroom: ' + l.classroom);
      if (l.meetingId) desc.push('ID: ' + l.meetingId);
      if (l.passcode) desc.push('Код: ' + l.passcode);
      if (l.note) desc.push(l.note);
      L.push('BEGIN:VEVENT');
      L.push('UID:' + l.id + '-' + l.day + l.slot + '@rozklad.local');
      L.push('DTSTAMP:' + dtstamp);
      L.push('DTSTART;TZID=Europe/Kyiv:' + stamp(d0, slot.start));
      L.push('DTEND;TZID=Europe/Kyiv:' + stamp(d0, slot.end));
      L.push('RRULE:FREQ=WEEKLY;INTERVAL=' + (l.week === 'both' ? 1 : 2) + ';UNTIL=' + untilUtc);
      L.push('SUMMARY:' + icsEscape(l.subject));
      if (l.room) L.push('LOCATION:' + icsEscape(l.room));
      if (primaryLink(l)) L.push('URL:' + icsEscape(primaryLink(l)));
      L.push('DESCRIPTION:' + icsEscape(desc.join('\n')));
      L.push('BEGIN:VALARM', 'TRIGGER:-PT10M', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(l.subject), 'END:VALARM');
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.map(fold).join('\r\n') + '\r\n';
  }
  function exportIcs() {
    if (!state.lessons.length) { toast('Немає занять для експорту.', true); return; }
    textModal('Календар (.ics)',
      'Скопіюйте текст, збережіть його у файл з назвою <b>rozklad.ics</b> і відкрийте — Google Calendar, Apple Calendar та Outlook імпортують усі пари семестру з нагадуванням за 10 хвилин.',
      buildIcs());
  }

  /* ---------- свіжість даних ----------
     GitHub Pages віддає HTML із max-age=600, тож після чужого збереження
     браузер до десяти хвилин показує старий розклад, а відкрита вкладка —
     взагалі до перезавантаження. Тихо перевіряємо джерело й підхоплюємо нові
     дані, не чіпаючи код сторінки. */
  /* Сторінка публікує власний код, тож вкладка зі старою версією при збереженні
     відкотила б свіжі правки. Порівнюємо відбиток коду з тим, що на сервері. */
  function hashStr(str) {
    var h = 5381, i = str.length;
    while (i) h = (h * 33) ^ str.charCodeAt(--i);
    return (h >>> 0).toString(36);
  }
  function codeStamp(css, js) { return hashStr(css) + '.' + hashStr(js) + '.' + (css.length + js.length); }
  var myCode = codeStamp($('#app-css').textContent, $('#app-js').textContent);

  var currentRaw = ($('#app-data').textContent || '').trim();
  var expectRaw = null;   // те, що ми щойно записали: чекаємо, доки Pages пересоберe
  var lastCheck = 0;

  function adoptData(raw) {
    try { state = normalize(JSON.parse(raw)); } catch (e) { return; }
    currentRaw = raw;
    unlocked = false; vaultPass = null;
    renderApp();
    if (hasVault() && savedPass() && cryptoOk()) {
      unlockWith(savedPass()).then(renderApp, function () { renderApp(); });
    }
    toast('Розклад оновили — показано свіжу версію.');
  }

  function checkFresh(force) {
    if (window.claude) return;                       // в Artifact оновлення прилітає само
    if (!/^https?:$/.test(location.protocol)) return; // локальний файл — нічого перевіряти
    var now = Date.now();
    if (!force && now - lastCheck < 60000) return;
    lastCheck = now;
    fetch(location.href, { cache: 'no-store' }).then(function (r) {
      return r.ok ? r.text() : null;
    }).then(function (html) {
      if (!html) return;
      var mc = /<style id="app-css">([\s\S]*?)<\/style>/.exec(html);
      var mj = /<script id="app-js">([\s\S]*?)<\/script>/.exec(html);
      if (mc && mj && codeStamp(mc[1], mj[1]) !== myCode && !ui.staleCode) {
        ui.staleCode = true; renderApp();
      }
      var m = /<script id="app-data" type="application\/json">([\s\S]*?)<\/script>/.exec(html);
      if (!m) return;
      var raw = m[1].trim();
      if (expectRaw) { if (raw === expectRaw) expectRaw = null; return; }
      if (raw === currentRaw) return;
      if (ui.dirty || ui.editing) { ui.stale = true; renderApp(); return; }
      adoptData(raw);
    }).catch(function () { });
  }

  /* ---------- actions ---------- */
  function byId(id) { return state.lessons.filter(function (l) { return l.id === id; })[0]; }

  function handleAct(t, e) {
    var act = t.getAttribute('data-act');
    if (act === 'ovl') { if (e.target === t) closeModal(); return; }
    switch (act) {
      case 'close': closeModal(); break;
      case 'parity': ui.parity = t.getAttribute('data-p'); renderApp(); break;
      case 'view': ui.view = t.getAttribute('data-v'); renderApp(); break;
      case 'today':
        ui.parity = null; ui.day = Math.min(todayIndex(), state.days.length - 1); renderApp(); break;
      case 'toggle-edit':
        if (!ui.editing && isLocked()) { passModal('unlock'); break; }
        ui.editing = !ui.editing; renderApp(); break;
      case 'day-step': {
        var d = ui.day == null ? Math.min(todayIndex(), state.days.length - 1) : ui.day;
        ui.day = (d + (+t.getAttribute('data-d')) + state.days.length) % state.days.length;
        renderApp(); break;
      }
      case 'day-pick': ui.day = +t.getAttribute('data-i'); renderApp(); break;
      case 'add': {
        if (!ui.editing) break;
        lessonModal({
          id: uid(), day: +t.getAttribute('data-day'), slot: +t.getAttribute('data-slot'), week: 'both',
          subject: '', teacher: '', kind: '', room: '', link: '', meetingId: '', passcode: '', note: ''
        }, true);
        break;
      }
      case 'edit': { var l = byId(t.getAttribute('data-id')); if (l) lessonModal(l, false); break; }
      case 'del': {
        var id = t.getAttribute('data-id'), le = byId(id);
        if (!le) break;
        if (!window.confirm('Видалити «' + (le.subject || 'пару') + '»?')) break;
        state.lessons = state.lessons.filter(function (x) { return x.id !== id; });
        markDirty(); closeModal(); renderApp(); break;
      }
      case 'dup': {
        var src = byId(t.getAttribute('data-id'));
        if (!src) break;
        var copy = JSON.parse(JSON.stringify(src));
        copy.id = uid();
        state.lessons.push(copy);
        markDirty(); closeModal(); renderApp();
        lessonModal(copy, false);
        break;
      }
      case 'copy': copyText(t.getAttribute('data-val'), t); break;
      case 'copy-area': { var ta = document.querySelector('#tarea'); if (ta) copyText(ta.value, null); break; }
      case 'do-import': doImport(); break;
      case 'export-json': exportJson(); break;
      case 'import-json': importJson(); break;
      case 'ics': exportIcs(); break;
      case 'print': window.print(); break;
      case 'settings': settingsModal(); break;
      case 'save': saveAll(); break;
      case 'token': tokenModal(); break;
      case 'unlock': passModal('unlock'); break;
      case 'relock': relock(); break;
      case 'reload': clearDraft(); location.reload(); break;
      case 'set-pass': passModal(hasVault() || vaultPass ? 'change' : 'set'); break;
      case 'drop-pass': dropPass(); break;
      case 'forget-token': ghSetToken(''); closeModal(); renderApp(); toast('Токен видалено з цього браузера.'); break;
      case 'add-slot': {
        applySettingsForm();
        var last = state.slots[state.slots.length - 1];
        var st = last ? toMin(last.end) + 10 : 480;
        state.slots.push({ n: state.slots.length + 1, start: fmtMin(st), end: fmtMin(st + 80) });
        state = normalize(state); markDirty(); settingsModal(); break;
      }
      case 'rm-slot': {
        var i = +t.getAttribute('data-i');
        applySettingsForm();
        if (state.slots.length > 1) state.slots.splice(i, 1);
        state.slots.forEach(function (s, k) { s.n = k + 1; });
        state = normalize(state); markDirty(); settingsModal(); break;
      }
    }
  }

  document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    var t = e.target.closest('[data-act]');
    if (t) { handleAct(t, e); return; }
    if (ui.editing) {
      var c = e.target.closest('.ls');
      if (c && c.getAttribute('data-id')) {
        var l = byId(c.getAttribute('data-id'));
        if (l) lessonModal(l, false);
      }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('#layer').innerHTML) { closeModal(); return; }
    if ($('#layer').innerHTML) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (ui.view === 'day' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      var d = ui.day == null ? Math.min(todayIndex(), state.days.length - 1) : ui.day;
      ui.day = (d + (e.key === 'ArrowRight' ? 1 : -1) + state.days.length) % state.days.length;
      renderApp(); e.preventDefault();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    tickNow(); checkFresh(false);
  });

  /* ---------- init ---------- */
  try {
    var draft = sessionStorage.getItem(DRAFT_KEY);
    if (draft && draft !== JSON.stringify(state)) {
      var d = JSON.parse(draft);
      if (d && Array.isArray(d.lessons)) { state = normalize(d); ui.dirty = true; }
    } else if (draft) { clearDraft(); }
  } catch (e) { }

  renderApp();
  setInterval(tickNow, 15000);
  setTimeout(function () { checkFresh(true); }, 1200);
  setInterval(function () { checkFresh(false); }, 300000);

  if (hasVault()) {
    if (!cryptoOk()) {
      toast('Браузер не дає доступ до шифрування — посилання лишаться закритими.', true);
    } else if (savedPass()) {
      unlockWith(savedPass()).then(renderApp, function () { rememberPass(''); renderApp(); });
    }
  }
})();
</script>
</body>
</html>
